name: Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded run on the same branch/PR when new commits land.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    # A deadlocked Qt/thread test must not be able to hang CI indefinitely.
    timeout-minutes: 15
    env:
      # Headless Qt: no real display, and no Xvfb needed for it. The test
      # suite is fixture/mock-based and never touches a real iPhone, USB
      # device, or Apple service — see tests/conftest.py.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      # Confirmed necessary by an actual CI failure (run #1, job
      # pytest (Ubuntu, Python 3.12), step "Python syntax / import
      # validation"): `from PySide6.QtWidgets import (...)` failed with
      # `ImportError: libEGL.so.1: cannot open shared object file`.
      # ubuntu-latest doesn't ship the Qt6 graphics runtime by default.
      # These five are the OS-level libraries `ldd` shows the installed
      # PySide6 wheel's Qt6 core/offscreen-plugin libraries link against
      # that aren't already guaranteed present on a minimal runner — not a
      # speculative list. QT_QPA_PLATFORM=offscreen still needs them: Qt6's
      # core libraries (libQt6Gui, in particular) resolve these at load
      # time, before any platform plugin or display is even selected.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Python syntax / import validation
        run: |
          python -m compileall -q core ui tests motunes.py motunes_diag.py storage_diag.py
          python -c "import ui.main_window, core.device, core.transfer, core.music, core.photos"

      - name: Run test suite
        timeout-minutes: 5
        run: python -m pytest tests/ -v
