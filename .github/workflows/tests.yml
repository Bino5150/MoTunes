name: Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded run on the same branch/PR when new commits land.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    # A deadlocked Qt/thread test must not be able to hang CI indefinitely.
    timeout-minutes: 15
    env:
      # Headless Qt: no real display, and no Xvfb needed for it. The test
      # suite is fixture/mock-based and never touches a real iPhone, USB
      # device, or Apple service — see tests/conftest.py.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Python syntax / import validation
        run: |
          python -m compileall -q core ui tests motunes.py motunes_diag.py storage_diag.py
          python -c "import ui.main_window, core.device, core.transfer, core.music, core.photos"

      - name: Run test suite
        timeout-minutes: 5
        run: python -m pytest tests/ -v
